<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TapMenu - Menu Digital</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1B4332',    /* Deep Emerald */
                        secondary: '#D8F3DC',  /* Mint */
                        accent: '#E07A5F',     /* Terracotta */
                        bg: '#F7F5F2',         /* Bone White */
                        dark: '#2D3436',       /* Charcoal */
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 2px 12px rgba(0,0,0,0.06)',
                        'floating': '0 -4px 20px rgba(0,0,0,0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F7F5F2;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hide Scrollbar but allow scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        .slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pop {
            animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0.9);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
</main>

<!-- Floating Cart Bar (Hidden by default) -->
<div id="cart-bar" class="fixed bottom-4 left-4 right-4 z-40 hidden slide-up">
    <div class="bg-primary text-white rounded-2xl p-4 shadow-floating flex justify-between items-center cursor-pointer"
        onclick="openCartModal()">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center font-bold text-lg"
                id="total-items-badge">
                0
            </div>
            <div class="flex flex-col">
                <span class="text-xs text-green-100">Total Pembayaran</span>
                <span class="font-bold text-lg" id="total-price-bar">Rp 0</span>
            </div>
        </div>
        <div
            class="flex items-center gap-2 font-bold text-sm bg-accent px-4 py-2 rounded-xl hover:bg-[#d06a50] transition-colors">
            Lihat Pesanan <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>
</div>
</div>

<!-- === CART / CHECKOUT MODAL === -->
<div id="cart-modal" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onclick="closeCartModal()"></div>

    <!-- Bottom Sheet -->
    <div class="absolute bottom-0 w-full bg-[#F7F5F2] rounded-t-[2rem] shadow-2xl h-[85vh] flex flex-col slide-up">

        <!-- Handle bar -->
        <div class="w-full flex justify-center pt-4 pb-2" onclick="closeCartModal()">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>

        <!-- Modal Header -->
        <div class="px-6 pb-4 border-b border-gray-200 flex justify-between items-center">
            <h2 class="text-xl font-bold text-primary">Pesanan Anda</h2>
            <button onclick="closeCartModal()"
                class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Cart Items (Scrollable) -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scroll" id="cart-items-container">
            <!-- Cart items injected here -->
        </div>

        <!-- Bill Details & Checkout -->
        <div class="bg-white p-6 rounded-t-[2rem] shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
            <div class="space-y-3 mb-6 text-sm">
                <div class="flex justify-between text-gray-500">
                    <span>Subtotal</span>
                    <span class="font-bold text-dark" id="bill-subtotal">Rp 0</span>
                </div>
                <div class="flex justify-between text-gray-500">
                    <span>Pajak & Layanan (10%)</span>
                    <span class="font-bold text-dark" id="bill-tax">Rp 0</span>
                </div>
                <div class="border-t border-dashed border-gray-300 my-2"></div>
                <div class="flex justify-between text-lg">
                    <span class="font-bold text-primary">Total</span>
                    <span class="font-extrabold text-accent" id="bill-total">Rp 0</span>
                </div>
            </div>

            <button onclick="processCheckout()"
                class="w-full py-4 bg-primary text-white font-bold rounded-xl shadow-lg hover:bg-[#143326] transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Pesan Sekarang
            </button>
        </div>
    </div>
</div>

<!-- === SUCCESS OVERLAY === -->
<div id="success-view"
    class="hidden fixed inset-0 z-[60] bg-primary flex flex-col items-center justify-center p-6 text-center text-white fade-in">
    <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6 animate-bounce">
        <i class="fa-solid fa-check text-4xl text-white"></i>
    </div>
    <h2 class="text-3xl font-bold mb-2">Pesanan Diterima!</h2>
    <p class="text-green-100 mb-8 max-w-xs mx-auto">Mohon tunggu sebentar, pesanan Anda sedang disiapkan oleh dapur.
    </p>

    <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl w-full max-w-xs border border-white/10">
        <p class="text-xs text-green-200 uppercase font-bold mb-1">Estimasi Waktu</p>
        <p class="text-2xl font-bold">15 - 20 Menit</p>
    </div>

    <button onclick="location.reload()"
        class="mt-10 px-8 py-3 border border-white/30 rounded-xl text-sm font-bold hover:bg-white/10 transition-colors">
        Kembali ke Menu
    </button>
</div>

<!-- JAVASCRIPT LOGIC -->
<script>
    // --- DATA MENU ---
    const menuItems = [
        {
            id: 1,
            name: "Nasi Goreng Spesial",
            desc: "Dengan telur mata sapi, sate ayam, dan kerupuk udang.",
            price: 25000,
            image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80",
            category: "food"
        },
        {
            id: 2,
            name: "Ayam Bakar Madu",
            desc: "Ayam kampung bakar dengan olesan madu dan sambal terasi.",
            price: 28000,
            image: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=400&q=80",
            category: "food"
        },
        {
            id: 3,
            name: "Sate Ayam Madura",
            desc: "10 tusuk sate ayam dengan bumbu kacang kental.",
            price: 30000,
            image: "https://images.unsplash.com/photo-1555126634-323283e090fa?auto=format&fit=crop&w=400&q=80",
            category: "food"
        },
        {
            id: 4,
            name: "Es Kopi Susu Gula Aren",
            desc: "Kopi arabika house blend dengan susu fresh milk.",
            price: 18000,
            image: "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=400&q=80",
            category: "drink"
        },
        {
            id: 5,
            name: "Es Teh Manis Jumbo",
            desc: "Teh tubruk wangi melati dengan gula asli.",
            price: 8000,
            image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=400&q=80",
            category: "drink"
        },
        {
            id: 6,
            name: "Pisang Goreng Keju",
            desc: "Pisang kepok kuning digoreng crispy topping keju.",
            price: 15000,
            image: "https://images.unsplash.com/photo-1519708227418-c8fd9a3a2b7b?auto=format&fit=crop&w=400&q=80",
            category: "snack"
        }
    ];

    // --- STATE MANAGEMENT ---
    let cart = {}; // { itemId: quantity }

    // --- FUNCTIONS ---


    renderMenu();

    function formatRupiah(number) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    function renderMenu() {
        const container = document.getElementById('menu-container');
        container.innerHTML = menuItems.map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-card flex gap-4 items-center md:items-start group">
                    <div class="w-24 h-24 md:w-32 md:h-32 bg-gray-100 rounded-xl overflow-hidden shrink-0 relative">
                        <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="${item.name}">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-dark text-lg leading-tight mb-1 truncate">${item.name}</h3>
                        <p class="text-xs text-gray-500 line-clamp-2 mb-3 leading-relaxed">${item.desc}</p>
                        <div class="flex justify-between items-end">
                            <span class="font-bold text-accent text-lg">${formatRupiah(item.price)}</span>
                            
                            <div class="flex items-center" id="btn-group-${item.id}">
                                ${getButtonState(item.id)}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
    }

    function getButtonState(id) {
        const qty = cart[id] || 0;
        if (qty === 0) {
            return `
                <button onclick="addToCart(${id})" class="w-9 h-9 bg-secondary text-primary rounded-lg flex items-center justify-center hover:bg-primary hover:text-white transition-colors shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                </button>`;
        } else {
            return `
                <div class="flex items-center gap-3 bg-[#F7F5F2] rounded-lg p-1 border border-gray-200 pop">
                    <button onclick="updateQty(${id}, -1)" class="w-7 h-7 bg-white text-primary rounded flex items-center justify-center shadow-sm"><i class="fa-solid fa-minus text-xs"></i></button>
                    <span class="font-bold text-dark text-sm w-2 text-center">${qty}</span>
                    <button onclick="updateQty(${id}, 1)" class="w-7 h-7 bg-primary text-white rounded flex items-center justify-center shadow-sm"><i class="fa-solid fa-plus text-xs"></i></button>
                </div>`;
        }
    }

    function addToCart(id) {
        cart[id] = 1;
        updateUI(id);
    }

    function updateQty(id, change) {
        if (cart[id] + change <= 0) {
            delete cart[id];
        } else {
            cart[id] += change;
        }
        updateUI(id);
    }

    function updateUI(id) {
        // Re-render button for specific item (Optimization: could replace innerHTML directly)
        const btnGroup = document.getElementById(`btn-group-${id}`);
        if (btnGroup) btnGroup.innerHTML = getButtonState(id);

        // Update Floating Bar
        updateCartBar();
        // Update Cart Modal Content if open
        renderCartItems();
    }

    function updateCartBar() {
        const totalQty = Object.values(cart).reduce((a, b) => a + b, 0);
        const bar = document.getElementById('cart-bar');

        if (totalQty > 0) {
            bar.classList.remove('hidden');
            // Calculate Total Price
            let total = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const item = menuItems.find(i => i.id == id);
                total += item.price * qty;
            }

            document.getElementById('total-items-badge').innerText = totalQty;
            document.getElementById('total-price-bar').innerText = formatRupiah(total);
        } else {
            bar.classList.add('hidden');
            closeCartModal(); // Close modal if empty
        }
    }

    function openCartModal() {
        document.getElementById('cart-modal').classList.remove('hidden');
        renderCartItems();
    }

    function closeCartModal() {
        document.getElementById('cart-modal').classList.add('hidden');
    }

    function renderCartItems() {
        const container = document.getElementById('cart-items-container');
        let html = '';
        let subtotal = 0;

        if (Object.keys(cart).length === 0) {
            container.innerHTML = '<div class="text-center text-gray-400 py-10">Keranjang kosong</div>';
            return;
        }

        for (const [id, qty] of Object.entries(cart)) {
            const item = menuItems.find(i => i.id == id);
            const itemTotal = item.price * qty;
            subtotal += itemTotal;

            html += `
                <div class="flex gap-4 items-center border-b border-gray-100 pb-4 last:border-0">
                    <div class="w-16 h-16 bg-gray-100 rounded-xl overflow-hidden shrink-0">
                        <img src="${item.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1">
                        <h4 class="font-bold text-dark text-sm">${item.name}</h4>
                        <p class="text-xs text-gray-500 mb-2">${formatRupiah(item.price)} / porsi</p>
                        <div class="flex justify-between items-center">
                             <div class="flex items-center gap-3 bg-[#F7F5F2] rounded-lg p-1">
                                <button onclick="updateQty(${id}, -1)" class="w-6 h-6 bg-white text-gray-500 rounded flex items-center justify-center shadow-sm hover:text-primary"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                <span class="font-bold text-dark text-xs w-4 text-center">${qty}</span>
                                <button onclick="updateQty(${id}, 1)" class="w-6 h-6 bg-primary text-white rounded flex items-center justify-center shadow-sm"><i class="fa-solid fa-plus text-[10px]"></i></button>
                            </div>
                            <span class="font-bold text-primary text-sm">${formatRupiah(itemTotal)}</span>
                        </div>
                    </div>
                </div>
                `;
        }

        container.innerHTML = html;

        // Bill Calculation
        const tax = subtotal * 0.1;
        const total = subtotal + tax;

        document.getElementById('bill-subtotal').innerText = formatRupiah(subtotal);
        document.getElementById('bill-tax').innerText = formatRupiah(tax);
        document.getElementById('bill-total').innerText = formatRupiah(total);
    }

    function processCheckout() {
        closeCartModal();
        // Simulasi Loading
        setTimeout(() => {
            document.getElementById('success-view').classList.remove('hidden');
        }, 300);
    }

</script>
</body>

</html>
