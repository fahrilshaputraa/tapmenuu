{% load static %}
<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TapMenu - Tambah Tim</title>
        <link rel="icon"
              type="image/svg+xml"
              href="{% static 'core/img/favicon.svg' %}">
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="{% static 'core/js/pages/register-1.js' %}?v=20260608-fix-tailwind"></script>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body class="font-sans text-dark antialiased min-h-screen bg-bg">
        <div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
            <!-- Progress Steps -->
            <div class="w-full max-w-lg mb-8">
                <div class="flex items-center justify-center gap-3 mb-2">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center text-sm font-bold">
                            <i class="fa-solid fa-check text-xs"></i>
                        </div>
                        <span class="text-sm font-medium text-gray-400">Profil Toko</span>
                    </div>
                    <div class="flex-1 max-w-[60px] h-0.5 bg-green-300"></div>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center text-sm font-bold">
                            <i class="fa-solid fa-check text-xs"></i>
                        </div>
                        <span class="text-sm font-medium text-gray-400">Tema</span>
                    </div>
                    <div class="flex-1 max-w-[60px] h-0.5 bg-green-300"></div>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold">3</div>
                        <span class="text-sm font-bold text-primary">Tim</span>
                    </div>
                </div>
            </div>
            <!-- Card -->
            <div class="w-full max-w-lg bg-white rounded-[2rem] shadow-2xl p-8">
                <div class="mb-7">
                    <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center text-white mb-4">
                        <i class="fa-solid fa-users text-xl"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-dark mb-1">Tambah anggota tim</h1>
                    <p class="text-sm text-gray-500">Undang kasir, admin, atau dapur. Bisa ditambah nanti dari dashboard.</p>
                </div>
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 px-4 py-3 rounded-xl text-sm font-medium {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %} flex items-center gap-2">
                            <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <!-- Add Employee Form -->
                <form method="post" class="space-y-4 mb-6">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="add_employee">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-[0.18em] mb-2">Email Karyawan</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email"
                                   name="email"
                                   placeholder="kasir@warung.com"
                                   autocomplete="email"
                                   class="w-full rounded-xl border border-gray-200 bg-[#FCFBF9] pl-11 pr-4 py-3.5 text-sm font-medium text-dark focus:outline-none focus:border-primary focus:ring-4 focus:ring-secondary/60 transition-all">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-[0.18em] mb-2">Peran</label>
                            <select name="role"
                                    class="w-full rounded-xl border border-gray-200 bg-[#FCFBF9] px-4 py-3.5 text-sm font-medium text-dark focus:outline-none focus:border-primary focus:ring-4 focus:ring-secondary/60 transition-all">
                                {% for value, label in role_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-[0.18em] mb-2">Password</label>
                            <input type="password"
                                   name="password"
                                   minlength="6"
                                   placeholder="Min. 6 karakter"
                                   autocomplete="new-password"
                                   class="w-full rounded-xl border border-gray-200 bg-[#FCFBF9] px-4 py-3.5 text-sm font-medium text-dark focus:outline-none focus:border-primary focus:ring-4 focus:ring-secondary/60 transition-all">
                        </div>
                    </div>
                    <button type="submit"
                            class="w-full px-6 py-3.5 bg-white border-2 border-primary text-primary font-bold rounded-xl hover:bg-secondary/30 transition-colors flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-user-plus"></i>
                        Tambah Karyawan
                    </button>
                </form>
                <div class="border-t border-gray-100 pt-6">
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="finish">
                        <button type="submit"
                                class="w-full px-6 py-4 bg-primary text-white font-bold rounded-xl shadow-lg hover:bg-primaryLight transition-all flex items-center justify-center gap-3 text-sm">
                            <i class="fa-solid fa-rocket"></i>
                            <span>Selesai & Masuk Dashboard</span>
                        </button>
                    </form>
                    <form method="post" class="mt-3">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="skip">
                        <button type="submit"
                                class="w-full px-6 py-3 text-gray-400 text-sm font-semibold hover:text-gray-600 transition-colors">
                            Lewati untuk sekarang
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
