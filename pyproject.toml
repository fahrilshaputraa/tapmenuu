[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".venv",
    "**/migrations/**",
    "db.sqlite3",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "DJ",
    "UP",
]
ignore = [
    "DJ001",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120
ignore = "H006,H021,H030,H031,T002,T003"
exclude = ".venv,design"
